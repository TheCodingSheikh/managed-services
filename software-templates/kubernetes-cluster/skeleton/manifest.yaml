apiVersion: managedservices.thecodingsheikh.io/v1alpha1
kind: KubernetesCluster
metadata:
  name: "${{ values.tenant }}-tenant-${{ values.params.name }}-kubernetes-cluster"
  annotations:
    lab.backstage.io/add-to-catalog: "true"
    lab.backstage.io/system-type: app
    lab.backstage.io/component-type: service
    lab.backstage.io/lifecycle: managed
    lab.backstage.io/dependsOn: component:default/${{ values.tenant }}-tenant
    lab.backstage.io/title: ${{ values.tenant | replace("-", " ") | title }} Tenant ${{ values.params.name | replace("-", " ") | title }} Kubernetes Cluster
    lab.backstage.io/name: ${{ values.tenant }}-tenant-${{ values.params.name }}-kubernetes-cluster
    lab.backstage.io/system: kubernetes-cluster
    lab.backstage.io/kubernetes-label-selector: 'app.kubernetes.io/instance=${{ values.tenant }}-tenant-${{ values.params.name }}-kubernetes-cluster'
    lab.backstage.io/links: |-
      [
        {
          "url": "https://${{ values.params.network.controlPlaneEndpoint }}:6443",
          "title": "Kubernetes API",
          "icon": "kubernetes"
        }
      ]
    backstage.io/last-applied-configuration: '${{ values.params | dump }}'
    backstage.io/scaffolder-template: template:default/kubernetes-cluster
    backstage.io/immutable-fields: 'tenant,name'
    backstage.io/scaffolder-edit-roles: 'admin,edit'
  label:
    app.kubernetes.io/instance: '${{ values.tenant }}-tenant-${{ values.params.name }}-kubernetes-cluster'
spec:
  values:
    tenant: ${{ values.tenant | quote }}
    name: ${{ values.params.name | quote }}
    version: ${{ values.params.version | quote }}
    controlPlane:
      highlyAvailable: ${{ values.params.controlPlane.highlyAvailable }}
      numCores: ${{ values.params.controlPlane.numCores }}
      memoryMiB: ${{ values.params.controlPlane.memoryMiB }}
      diskGb: ${{ values.params.controlPlane.diskGb }}
    {%- if values.params.nodePools %}
    nodePools:
      {%- for p in values.params.nodePools %}
      - name: ${{ p.name | quote }}
        replicas: ${{ p.replicas }}
        numCores: ${{ p.numCores }}
        memoryMiB: ${{ p.memoryMiB }}
        diskGb: ${{ p.diskGb }}
      {%- endfor %}
    {%- endif %}
    network:
      controlPlaneEndpoint: ${{ values.params.network.controlPlaneEndpoint | quote }}
      {%- if values.params.network.nodeAddresses %}
      nodeAddresses:
        {%- for r in values.params.network.nodeAddresses %}
        - ${{ r | quote }}
        {%- endfor %}
      {%- endif %}
