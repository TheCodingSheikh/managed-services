{{- $name := include "kcluster.clusterName" . -}}
{{- /*
  The Proxmox API credential the workload cluster's CCM and CSI need. Pulled
  from Vault into this namespace, then shipped into the workload cluster by the
  ClusterResourceSet below.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}-cloud-config
  labels:
    {{- include "lib.labels" . | nindent 4 }}
  annotations:
    {{- include "lib.argocdAnnotations" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ $name }}-cloud-config
    template:
      engineVersion: v2
      # ClusterResourceSet ignores the payload Secret without this exact type.
      type: addons.cluster.x-k8s.io/resource-set
      data:
        proxmox-cloud-config.yaml: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: proxmox-cloud-config
            namespace: kube-system
          type: Opaque
          stringData:
            config.yaml: |
              features:
                provider: capmox
              clusters:
                - url: {{ `{{ .url }}` }}
                  insecure: {{ `{{ .insecure }}` }}
                  token_id: {{ `{{ .token_id }}` }}
                  token_secret: {{ `{{ .token_secret }}` }}
                  region: {{ .Values.infra.region }}
  data:
    - secretKey: url
      remoteRef:
        key: storage/proxmox-csi
        property: url
    - secretKey: insecure
      remoteRef:
        key: storage/proxmox-csi
        property: insecure
    - secretKey: token_id
      remoteRef:
        key: storage/proxmox-csi
        property: token_id
    - secretKey: token_secret
      remoteRef:
        key: storage/proxmox-csi
        property: token_secret
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-cloud-config
  labels:
    {{- include "lib.labels" . | nindent 4 }}
  annotations:
    {{- include "lib.argocdAnnotations" . | nindent 4 }}
spec:
  clusterSelector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $name }}
  strategy: Reconcile
  resources:
    - kind: Secret
      name: {{ $name }}-cloud-config
