{{- $name := include "kcluster.clusterName" . -}}
{{- /*
  Pushes the workload cluster's kubeconfig into Vault so it can be consumed
  outside this namespace.

  The source Secret is created by Cluster API, not by this chart, and only once
  the control plane has initialised — so this PushSecret reports an error for
  the first few minutes of a new cluster and resolves itself. Cluster API also
  rotates the credential before its client certificate expires; the push
  follows automatically.
*/}}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $name }}-kubeconfig
  labels:
    {{- include "lib.labels" . | nindent 4 }}
  annotations:
    {{- include "lib.argocdAnnotations" . | nindent 4 }}
spec:
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: vault-backend
  selector:
    secret:
      name: {{ $name }}-kubeconfig
  data:
    - match:
        {{- /* The CAPI kubeconfig Secret carries a single key, "value". */}}
        secretKey: value
        remoteRef:
          remoteKey: tenant/{{ .Values.tenant }}/kubernetes-cluster/{{ .Values.name }}/kubeconfig
          property: value
