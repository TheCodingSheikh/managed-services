{{- $name := include "kcluster.clusterName" . -}}
{{- $cp := .Values.controlPlane | default dict -}}
{{- $spec := include "kcluster.machineSpec" (dict "root" $ "sizing" $cp "role" "control-plane") -}}
{{- $rev := include "kcluster.rev" $spec -}}
{{- $tmpl := printf "%s-cp-%s" $name $rev -}}
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: {{ $name }}-control-plane
  labels:
    {{- include "lib.labels" . | nindent 4 }}
  annotations:
    {{- include "lib.argocdAnnotations" . | nindent 4 }}
spec:
  {{- /* The one knob the form exposes: 1 node, or 3 for stacked-etcd quorum. */}}
  replicas: {{ ternary 3 1 ($cp.highlyAvailable | default false) }}
  version: {{ .Values.version }}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        {{- /*
          The revision suffix is the rollout trigger. Cluster API compares this
          name, not the template's contents, so a resize only takes effect
          because the name changed with it.
        */}}
        name: {{ $tmpl }}
  kubeadmConfigSpec:
    files:
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        owner: root:root
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: kube-vip
            namespace: kube-system
          spec:
            containers:
              - name: kube-vip
                image: ghcr.io/kube-vip/kube-vip:{{ .Values.addons.kubeVip }}
                imagePullPolicy: IfNotPresent
                args:
                  - manager
                env:
                  - name: cp_enable
                    value: "true"
                  - name: vip_interface
                    value: ""
                  - name: address
                    value: "{{ .Values.network.controlPlaneEndpoint }}"
                  - name: port
                    value: "6443"
                  - name: vip_arp
                    value: "true"
                  - name: vip_leaderelection
                    value: "true"
                  - name: vip_leaseduration
                    value: "15"
                  - name: vip_renewdeadline
                    value: "10"
                  - name: vip_retryperiod
                    value: "2"
                securityContext:
                  capabilities:
                    add:
                      - NET_ADMIN
                      - NET_RAW
                volumeMounts:
                  - name: kubeconfig
                    mountPath: /etc/kubernetes/admin.conf
            hostAliases:
              - ip: 127.0.0.1
                hostnames:
                  - localhost
                  - kubernetes
            hostNetwork: true
            volumes:
              - name: kubeconfig
                hostPath:
                  path: /etc/kubernetes/admin.conf
                  type: FileOrCreate
      {{- /*
        kubeadm 1.29+ writes admin.conf without cluster-admin, so kube-vip
        cannot use it before the API server is up. Point it at super-admin.conf
        for the bootstrap window instead.
      */}}
      - path: /etc/kube-vip-prepare.sh
        owner: root:root
        permissions: "0700"
        content: |
          #!/bin/bash
          set -e

          KUBEADM_MINOR="$(kubeadm version -o short | cut -d '.' -f 2)"
          if [[ "$KUBEADM_MINOR" -lt "29" ]]; then
            exit 0
          fi

          if [[ -f /run/kubeadm/kubeadm.yaml ]]; then
            sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' \
              /etc/kubernetes/manifests/kube-vip.yaml
          fi
    preKubeadmCommands:
      - /etc/kube-vip-prepare.sh
    {{- /*
      The kubeadm bootstrap provider marks its user-data as a jinja template, so
      this resolves against the NoCloud meta-data CAPMOX injects. That is how the
      node gets its providerID without waiting for the cloud controller manager.
    */}}
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: provider-id
            value: "proxmox://'{{ `{{ ds.meta_data.instance_id }}` }}'"
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: provider-id
            value: "proxmox://'{{ `{{ ds.meta_data.instance_id }}` }}'"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $tmpl }}
  labels:
    {{- include "lib.labels" . | nindent 4 }}
  annotations:
    {{- include "lib.argocdAnnotations" . | nindent 4 }}
spec:
  template:
    spec:
      {{- $spec | nindent 6 }}
